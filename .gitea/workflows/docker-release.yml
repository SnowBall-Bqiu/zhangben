name: Docker Release

# 需要在 Gitea 仓库中配置的变量和密钥：
# 仓库变量（Variables）：
# - ALIYUN_REGISTRY_USERNAME：阿里云容器镜像服务 ACR 用户名
# 仓库密钥（Secrets）：
# - ALIYUN_REGISTRY_PASSWORD：阿里云容器镜像服务 ACR 登录密码
# - ALIYUN_REGISTRY_USERNAME：可选；未配置变量 ALIYUN_REGISTRY_USERNAME 时作为兜底用户名

on:
  release:
    types: [published]

env:
  REGISTRY: registry.cn-hangzhou.aliyuncs.com
  IMAGE_NAME: bqiu/zhangben

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        run: echo "IMAGE_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"

      - name: Login to Aliyun registry
        env:
          ALIYUN_REGISTRY_USERNAME: ${{ vars.ALIYUN_REGISTRY_USERNAME }}
          ALIYUN_REGISTRY_USERNAME_SECRET: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          ALIYUN_REGISTRY_PASSWORD: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
        run: |
          REGISTRY_USERNAME="${ALIYUN_REGISTRY_USERNAME:-$ALIYUN_REGISTRY_USERNAME_SECRET}"
          test -n "$REGISTRY_USERNAME" || (echo "ALIYUN_REGISTRY_USERNAME variable or secret is empty" && exit 1)
          test -n "$ALIYUN_REGISTRY_PASSWORD" || (echo "ALIYUN_REGISTRY_PASSWORD secret is empty" && exit 1)
          echo "$ALIYUN_REGISTRY_PASSWORD" | docker login "$REGISTRY" --username "$REGISTRY_USERNAME" --password-stdin

      - name: Check Docker daemon
        run: |
          if [ ! -S /var/run/docker.sock ]; then
            echo "Docker daemon is unavailable: /var/run/docker.sock is missing. Configure the Gitea runner with Docker access."
            exit 1
          fi
          docker info

      - name: Build and push Docker image
        run: |
          docker build \
            -t "$REGISTRY/$IMAGE_NAME:$IMAGE_TAG" \
            -t "$REGISTRY/$IMAGE_NAME:latest" \
            .
          docker push "$REGISTRY/$IMAGE_NAME:$IMAGE_TAG"
          docker push "$REGISTRY/$IMAGE_NAME:latest"
