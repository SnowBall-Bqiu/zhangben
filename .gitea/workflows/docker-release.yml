name: Docker Release

on:
  push:
    branches:
      - "**"
  release:
    types: [published]

env:
  REGISTRY: registry.cn-hangzhou.aliyuncs.com
  IMAGE_NAME: bqiu/zhangben

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'release' || vars.ENABLE_PUSH_BUILD == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        run: |
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            echo "IMAGE_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          else
            echo "IMAGE_TAG=${GITHUB_SHA}" >> "$GITHUB_ENV"
          fi

      - name: Login to Aliyun registry
        env:
          ALIYUN_REGISTRY_USERNAME: ${{ vars.ALIYUN_REGISTRY_USERNAME }}
          ALIYUN_REGISTRY_USERNAME_SECRET: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          ALIYUN_REGISTRY_PASSWORD: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
        run: |
          REGISTRY_USERNAME="${ALIYUN_REGISTRY_USERNAME:-$ALIYUN_REGISTRY_USERNAME_SECRET}"
          test -n "$REGISTRY_USERNAME" || (echo "ALIYUN_REGISTRY_USERNAME variable or secret is empty" && exit 1)
          test -n "$ALIYUN_REGISTRY_PASSWORD" || (echo "ALIYUN_REGISTRY_PASSWORD secret is empty" && exit 1)
          echo "$ALIYUN_REGISTRY_PASSWORD" | docker login "$REGISTRY" --username "$REGISTRY_USERNAME" --password-stdin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        if: ${{ github.event_name == 'release' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Build and push Docker image for commit
        if: ${{ github.event_name == 'push' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
