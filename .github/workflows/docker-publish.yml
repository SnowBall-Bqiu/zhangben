name: Publish Docker image

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - VERSION

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: snowball-bqiu/zhangben

jobs:
  build-and-push:
    name: Build and push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Resolve and validate version
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          file_version="$(sed 's/\r$//' VERSION)"

          if [[ ! "$file_version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must use the vX.X.X format; found: $file_version" >&2
            exit 1
          fi

          if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
            image_tag="$RELEASE_TAG"
            if [[ ! "$image_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Release tag must use the vX.X.X format; found: $image_tag" >&2
              exit 1
            fi
            if [[ "$image_tag" != "$file_version" ]]; then
              echo "Release tag ($image_tag) must match VERSION ($file_version)" >&2
              exit 1
            fi
          else
            image_tag="$file_version"
          fi

          echo "tag=$image_tag" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
